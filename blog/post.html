<!DOCTYPE html>
<html data-fx="clean" data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="light dark" name="color-scheme"/>
<link href="../assets/css/system.css" rel="stylesheet"/>
<title>Post • Xiang Li</title>
</head>
<body data-page="post">
<div class="page page-content">
<main class="contentPage articlePage" aria-label="Blog post">
<header class="pageHero articleHero">
  <div class="breadcrumb" id="pageBreadcrumb"><a href="./">Blog</a> / <span>Post</span></div>
  <div class="pageKicker">Blog</div>
  <h1 id="postTitle">Post title</h1>
  <p class="pageLead" id="postSub"></p>
</header>
<div class="articleShell">
  <article class="articlePanel">
    <div class="articleBody" id="postContent"></div>
  </article>
  <aside class="postToc" id="postToc" aria-label="Table of contents">
    <nav class="tocNav" id="tocNav"></nav>
    <div class="tocProgress" id="tocProgress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><div class="tocProgressFill"></div></div>
  </aside>
</div>
<div class="muted" id="fatal"></div>
</main>
</div>
<nav aria-label="Site dock" class="dock" id="dock"></nav>
<script src="../assets/js/site.js" type="module"></script>
</body>
</html>
