<!DOCTYPE html>
<html data-fx="clean" data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="light dark" name="color-scheme"/>
<link href="../assets/css/system.css" rel="stylesheet"/>
<title>Publications • Xiang Li</title>
</head>
<body data-page="pubs">
<div class="page page-content">
<main class="contentPage" aria-label="Publications">
<header class="pageHero">
  <div class="breadcrumb"><a href="../">Home</a> / <span data-typing="1">Publications</span></div>
  <div class="pageKicker">Publications</div>
  <h1><span class="cmd" data-typing="1">Publications and Preprints</span></h1>
  <p class="pageLead">A list of my research papers and preprints.</p>
</header>
<section class="sectionCard toolbarCard">
  <div class="filterGrid">
    <div><label for="pubQuery">Search</label><input id="pubQuery" placeholder="title / author / venue" type="text"/></div>
    <div><label for="pubType">Type</label><select id="pubType"></select></div>
    <div><label for="pubYear">Year</label><select id="pubYear"></select></div>
  </div>
</section>
<section class="sectionCard">
  <div class="sectionHead"><h2>All publications</h2><p class="muted">Use filters to narrow results.</p></div>
  <div class="listStack" id="pubList"></div>
</section>
<div class="muted" id="fatal"></div>
</main>
</div>
<nav aria-label="Site dock" class="dock" id="dock"></nav>
<script src="../assets/js/site.js" type="module"></script>
</body>
</html>
