# The introduction. Markdown is allowed.
about: |
  Hi — I'm **Xiang Li**.

  I build tools to see inside AI — so we can trust **what it thinks**, not just what it says.

  I'm currently a research intern at Stony Brook University, fortunate to be advised by [Prof. Jiawei Zhou](https://joezhouai.com/). I got my M.S. from University of Chicago, and my B.S. from Sichuan University, where I was advised by [Prof. Ta-Ping Lu](https://scupi.scu.edu.cn/en/faculty-staff-en/faculty-en/robert-lu).

# Research themes (also used by the first two channels of the work board).
researchThemes:
  - key: trajectories
    title: Geometry-based trajectory analysis
    oneLiner: Predict correctness from hidden-state trajectories—no ground-truth labels.
    question: What can we learn from hidden-state trajectories?
    details: >-
      I treat hidden-state trajectories as **high-dimensional geometry** and design compact
      metrics to detect anomaly signatures (e.g., hallucination vs. correct reasoning).
  - key: clusters
    title: Unsupervised cluster-as-lens
    oneLiner: Track concept formation via split/merge transitions across layers.
    question: How to study more about model internals?
    details: >-
      Layer-wise clustering reveals **emergence / splitting / merging** of representation
      groups—useful for safety checks, hallucination detection, and editing.

featuredWork:
  title: How to explore trajectories within model internals
  status: Anonymous ACL submission
  links:
